<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Noto Sans CJK JP','Noto Serif CJK JP','IPAexGothic','Hiragino Sans',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs>
<rect width="1600" height="1000" fill="#f8fafc"/>
<text x="40" y="48" font-size="30" font-weight="bold" fill="#0f172a">Civic Lens システムアーキテクチャ</text>
<text x="40" y="80" font-size="17" fill="#475569">行政に怒ることに疲れた市民に代わり、AIエージェントたちがSDGsの観点で怒り、開示請求する行政文書を特定・出力する</text>

<!-- 市民 -->
<rect x="40" y="130" width="240" height="400" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="160" y="164" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">市民（ブラウザ）</text>
<text x="58" y="202" font-size="16" fill="#334155">・行政への怒りを入力</text>
<text x="58" y="228" font-size="16" fill="#334155">  （添付: 通知書・写真）</text>
<text x="58" y="258" font-size="16" fill="#334155">・地域のニュース一覧</text>
<text x="58" y="288" font-size="16" fill="#334155">・SDGs怒りグラフを確認</text>
<text x="58" y="318" font-size="16" fill="#334155">・開示請求書を確認・編集</text>
<text x="58" y="348" font-size="16" fill="#334155">・提出して結果を記録</text>
<text x="58" y="374" font-size="14" fill="#64748b">  開示/一部開示/不開示/未提出</text>
<text x="160" y="490" font-size="15" text-anchor="middle" fill="#b45309" font-weight="bold">請求するかは必ず本人が決める</text>
<text x="160" y="512" font-size="14" text-anchor="middle" fill="#b45309">（Human-in-the-loop）</text>

<!-- Cloud Run -->
<rect x="320" y="110" width="820" height="740" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="340" y="142" font-size="21" font-weight="bold" fill="#1d4ed8">Google Cloud Run（asia-northeast1）— FastAPI app.py</text>

<rect x="350" y="162" width="760" height="72" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
<text x="370" y="190" font-size="18" font-weight="bold" fill="#0f172a">① 入力: 市民の訴え（中核） / 地域ニュース（NewsCollectorAgent）</text>
<text x="370" y="218" font-size="15" fill="#475569">添付資料は Gemini Vision で読み取り。GPSで対象自治体を推定</text>

<rect x="350" y="252" width="760" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="370" y="282" font-size="19" font-weight="bold" fill="#b91c1c">② SDGs怒りエージェント団（sdgs_scorer.py）★今回追加</text>
<text x="370" y="310" font-size="15" fill="#475569">17体の目標エージェントが市民の代わりに怒る：17目標 × 公式169ターゲット</text>
<text x="370" y="334" font-size="15" fill="#475569">各目標 → 怒りスコア0〜10 / 怒りのコメント / ターゲット番号（実在番号のみ検証）</text>
<text x="370" y="358" font-size="15" fill="#475569">上位目標の怒り → 「確認すべき文書の観点」と開示請求の根拠文</text>
<text x="370" y="382" font-size="14" fill="#64748b">ニュースでは名乗り出たSDGsエージェントの声も並行生成（AI生成のフィクションと明示）</text>

<rect x="350" y="420" width="760" height="100" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
<text x="370" y="450" font-size="18" font-weight="bold" fill="#0f172a">③ 開示請求対象の特定（CivicLensAgent / 統合エージェント）</text>
<text x="370" y="476" font-size="15" fill="#475569">対象機関・請求する行政文書・根拠条例・期限を特定（請求先ごとに集約）</text>
<text x="370" y="500" font-size="15" fill="#475569">SDGsの怒りは「何を・なぜ請求するか」の根拠として添える</text>

<rect x="350" y="538" width="760" height="100" rx="10" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
<text x="370" y="568" font-size="18" font-weight="bold" fill="#0f172a">④ 開示請求書の生成（Gemini）</text>
<text x="370" y="594" font-size="15" fill="#475569">プランA 迅速開示 / プランB 網羅的。個人情報の記入欄はAIが埋めない</text>
<text x="370" y="618" font-size="15" fill="#15803d" font-weight="bold">few-shot: 同じ機関・地域で開示につながった過去の請求を最大3件参照 ★</text>

<rect x="350" y="656" width="760" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="370" y="686" font-size="18" font-weight="bold" fill="#15803d">⑤ 結果フィードバック（disclosure_outcomes.py）★今回追加</text>
<text x="370" y="712" font-size="15" fill="#475569">請求書ごとに 開示/一部開示/不開示/未提出 を記録 → 機関別の開示率を集計</text>
<text x="370" y="732" font-size="14" fill="#64748b">実行時のコード書き換えはしない。改善はデータ（記録）経由のみ</text>

<rect x="350" y="760" width="760" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="370" y="788" font-size="16" font-weight="bold" fill="#0f172a">ガードレール・費用ガード</text>
<text x="370" y="812" font-size="14" fill="#475569">生成結果の検査 / Gemini日次上限 / レート制限 / モデル自動フォールバック</text>

<!-- 右側 GCP -->
<rect x="1180" y="130" width="380" height="200" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1200" y="164" font-size="19" font-weight="bold" fill="#6d28d9">Gemini API</text>
<text x="1200" y="194" font-size="15" fill="#475569">gemini_models.py で一元管理</text>
<text x="1200" y="218" font-size="15" fill="#475569">pro: 分析・請求書生成・Vision</text>
<text x="1200" y="242" font-size="15" fill="#475569">flash: SDGs採点・登場判定</text>
<text x="1200" y="266" font-size="15" fill="#475569">404/429時は次のモデルへ自動切替</text>
<text x="1200" y="300" font-size="14" fill="#64748b">失敗時はルールベースに縮退</text>

<rect x="1180" y="360" width="380" height="200" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="1200" y="394" font-size="19" font-weight="bold" fill="#b45309">Cloud Firestore</text>
<text x="1200" y="424" font-size="15" fill="#475569">disclosure_outcomes ★</text>
<text x="1200" y="448" font-size="15" fill="#475569">  （請求の結果・抜粋・機関・地域）</text>
<text x="1200" y="472" font-size="15" fill="#475569">ニュース分析の記録・履歴</text>
<text x="1200" y="496" font-size="15" fill="#475569">ユーザー（Firebase Auth）</text>
<text x="1200" y="530" font-size="14" fill="#64748b">未設定環境ではローカルJSONに縮退</text>

<rect x="1180" y="590" width="380" height="110" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2.5"/>
<text x="1200" y="624" font-size="19" font-weight="bold" fill="#0e7490">Secret Manager</text>
<text x="1200" y="654" font-size="15" fill="#475569">gemini-api-key / auth-secret-key</text>
<text x="1200" y="678" font-size="15" fill="#475569">専用サービスアカウントのみ参照可</text>

<rect x="1180" y="730" width="380" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="1200" y="764" font-size="19" font-weight="bold" fill="#334155">Cloud Build / Artifact Registry</text>
<text x="1200" y="794" font-size="15" fill="#475569">gcloud run deploy --source .</text>
<text x="1200" y="816" font-size="15" fill="#475569">（Dockerfile: python3.12 + uvicorn）</text>

<!-- arrows -->
<line x1="280" y1="230" x2="348" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="348" y1="600" x2="282" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="282" y1="360" x2="348" y2="700" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="730" y1="234" x2="730" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="730" y1="402" x2="730" y2="418" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="730" y1="520" x2="730" y2="536" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1110" y1="320" x2="1178" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<line x1="1110" y1="580" x2="1178" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<line x1="1110" y1="700" x2="1178" y2="460" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
<path d="M1178 430 C 1150 430, 1130 610, 1112 610" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#g)"/>
<line x1="1178" y1="645" x2="1142" y2="645" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>

<!-- loop legend -->
<rect x="40" y="870" width="1520" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="60" y="902" font-size="19" font-weight="bold" fill="#15803d">♻ 自己改善ループ</text>
<text x="60" y="934" font-size="16" fill="#334155">請求書を生成 → 市民が提出 → 結果（開示/一部開示/不開示/未提出）を記録 → Firestore に蓄積 → 次の請求書生成で、同じ機関・地域の「開示・一部開示」事例を few-shot として参照</text>
<text x="60" y="958" font-size="15" fill="#64748b">★ = 第5回ハッカソン期間中に追加（SDGs怒りエージェント団・Cloud Run本番デプロイ・結果記録＋few-shotループ）。それ以外は9/5ミニハッカソン発の既存部分</text>
</svg>
